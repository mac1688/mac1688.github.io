<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王雪松 WANG XUESONG - 空间设计作品集 | Interior Design Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ======== VARIABLES ======== */
:root {
  --bg:#08080a;--surface:#0f0f13;--surface2:#16161c;--border:rgba(255,255,255,0.05);
  --text:#e0ded8;--text2:#9a9790;--text3:#5c5955;
  --accent:#d4445a;--accent-dim:#d4445a1E;--accent-hue:352;
  --font-serif:'EB Garamond','Noto Serif SC',Georgia,serif;
  --font-sans:'Outfit','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  --transition:0.5s cubic-bezier(0.22,1,0.36,1);
}

/* ======== RESET ======== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:17px;-webkit-font-smoothing:antialiased}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);line-height:1.75;overflow-x:hidden;font-weight:300;transition:background var(--transition),color var(--transition)}
a{color:inherit;text-decoration:none}

/* ======== CANVAS BG ======== */
#bgCanvas{position:fixed;inset:0;z-index:0;opacity:0.85;pointer-events:none}
#glowCanvas{position:fixed;inset:0;z-index:1;opacity:0.3;pointer-events:none;mix-blend-mode:screen}

/* ======== HEADER ======== */
#header{position:fixed;top:0;left:0;right:0;z-index:100;padding:24px 48px;display:flex;justify-content:space-between;align-items:center;transition:all 0.5s}
#header.scrolled{background:rgba(8,8,10,0.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:16px 48px}
.logo{font-family:var(--font-serif);font-size:20px;font-weight:500;letter-spacing:-0.3px;color:#fff}.logo span{color:var(--accent)}.logo .sub{display:block;font-size:8px;letter-spacing:3px;font-weight:400;color:var(--text3);text-transform:uppercase}.logo .sub2{display:block;font-size:7.5px;letter-spacing:2px;font-weight:400;color:var(--text3);text-transform:uppercase;margin-top:1px}
#header nav{display:flex;gap:28px}
#header nav a{color:var(--text3);font-size:11px;font-weight:500;letter-spacing:1px;transition:color 0.25s;text-transform:uppercase;position:relative}
#header nav a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:1px;background:var(--accent);transition:width 0.3s}
#header nav a:hover,#header nav a.active{color:var(--text)}
#header nav a:hover::after,#header nav a.active::after{width:100%}
.header-actions{display:flex;gap:8px;align-items:center}
#liveClock{font-family:var(--font-mono);font-size:11px;color:var(--text2);margin-right:12px;letter-spacing:0.5px;min-width:70px;text-align:right;user-select:none}
#navMiniClock{font-family:var(--font-mono);font-size:9px;color:var(--text3);margin-right:6px;letter-spacing:0.5px;min-width:44px;text-align:right;user-select:none}
.theme-dots{display:flex;gap:6px;margin-right:16px;align-items:center}
.theme-dot{width:10px;height:10px;border-radius:50%;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;border:1px solid transparent;position:relative}
.theme-dot:hover{transform:scale(1.3)}
.theme-dot.active{box-shadow:0 0 0 2px var(--accent),0 0 12px var(--accent-dim);border-color:rgba(255,255,255,0.3)}
.theme-dot .tooltip{position:absolute;bottom:120%;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);font-size:9px;padding:3px 8px;border-radius:3px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.2s;font-family:var(--font-sans);letter-spacing:0.5px}
.theme-dot:hover .tooltip{opacity:1}
.carousel-btn{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,0.15);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-right:8px;transition:all 0.3s;position:relative;flex-shrink:0}
.carousel-btn::after{content:'';width:6px;height:6px;border:solid var(--text3);border-width:2px 2px 0 0;transform:rotate(45deg);transition:border-color 0.3s}
.carousel-btn:hover{border-color:var(--accent)}
.carousel-btn:hover::after{border-color:var(--accent)}
.carousel-btn.rotating{border-color:var(--accent);animation:carouselPulse 1.4s ease-in-out infinite}
.carousel-btn.rotating::after{border-color:var(--accent)}
@keyframes carouselPulse{0%,100%{box-shadow:0 0 0 0 rgba(212,68,90,0.4)}50%{box-shadow:0 0 0 6px rgba(212,68,90,0)}}
.nav-btn{padding:8px 18px;border:1px solid rgba(255,255,255,0.1);border-radius:0;background:transparent;color:var(--text2);font-size:10px;cursor:pointer;transition:all 0.25s;font-family:var(--font-sans);letter-spacing:1px;text-transform:uppercase;font-weight:500}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);transform:scale(1.02)}
.nav-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.nav-btn.primary:hover{background:transparent;color:var(--accent);transform:scale(1.02)}

/* ======== HERO ======== */
.hero-section{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:160px 48px 80px;max-width:1040px;margin:0 auto;width:100%}
.hero-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin-bottom:28px;font-weight:500}
.hero-headline{font-family:var(--font-serif);font-size:clamp(38px,7.5vw,78px);font-weight:400;line-height:1.04;letter-spacing:-2px;margin-bottom:36px;max-width:820px;color:#fff}
.hero-intro{font-size:clamp(15px,1.7vw,17px);color:var(--text2);max-width:580px;line-height:1.9;margin-bottom:48px;font-weight:300}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap}
.btn{padding:14px 36px;font-size:12px;font-weight:600;letter-spacing:0.8px;cursor:pointer;transition:all 0.35s;border:none;font-family:var(--font-sans);text-transform:uppercase;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 12px 40px var(--accent-dim)}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,0.15);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);transform:scale(1.02)}

/* ======== SECTIONS ======== */
.section{max-width:1040px;margin:0 auto;width:100%;padding:120px 48px;position:relative;z-index:2}
.section-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:3.5px;text-transform:uppercase;color:var(--accent);margin-bottom:20px;font-weight:500}
.section-title{font-family:var(--font-serif);font-size:clamp(30px,5vw,52px);font-weight:400;letter-spacing:-1.2px;line-height:1.1;margin-bottom:14px;color:#fff}
.section-sub{font-size:15px;color:var(--text2);max-width:520px;margin-bottom:64px;line-height:1.8;font-weight:300}

/* ======== STATS ======== */
.stats-row{max-width:1040px;margin:0 auto;width:100%;padding:0 48px 120px;position:relative;z-index:2}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px}
.stat-item{padding:44px 20px;text-align:center;background:var(--surface);transition:transform 0.4s,background 0.4s,box-shadow 0.4s;position:relative}
.stat-item:hover{background:var(--surface2);transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.stat-item .st-del{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);color:var(--text3);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:all 0.25s;z-index:5}
.stat-item:hover .st-del{opacity:1}
.stat-item .st-del:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.stat-value{font-family:var(--font-serif);font-size:clamp(26px,3.5vw,40px);font-weight:400;color:var(--accent);line-height:1}
.stat-label{font-size:10.5px;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;margin-top:10px;font-weight:500}
.stat-unit{font-size:8.5px;color:var(--text3);letter-spacing:2px;margin-top:4px}
.module-add-btn{display:flex;align-items:center;justify-content:center;padding:24px;background:var(--surface);border:1px dashed var(--border);cursor:pointer;transition:all 0.4s;flex-direction:column;gap:8px;grid-column:1/-1}
.module-add-btn:hover{border-color:var(--accent);background:var(--surface2);transform:translateY(-4px)}
.module-add-btn .plus{font-size:32px;color:var(--text3);transition:color 0.3s;font-weight:300;line-height:1}
.module-add-btn:hover .plus{color:var(--accent)}
.module-add-btn span{font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;font-weight:500}
.item-del{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.12);color:var(--text3);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:all 0.25s;z-index:5}
.skill-item:hover .item-del,.process-item:hover .item-del,.service-item:hover .item-del,.case-item:hover .item-del,.testimonial-item:hover .item-del,.insight-item:hover .item-del,.philo-item:hover .item-del,.edu-item:hover .item-del,.timeline-item:hover .item-del,.faq-item .item-del{opacity:1}
.item-del:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.faq-item .item-del{position:absolute;top:16px;right:0}

/* ======== PROJECTS ======== */
.projects-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.project-card{background:var(--surface);cursor:pointer;overflow:hidden;transition:transform 0.5s,box-shadow 0.5s;position:relative}
.project-card:hover{transform:translateY(-6px);box-shadow:0 20px 50px rgba(0,0,0,0.4);z-index:2}
.project-card .pc-delete{position:absolute;top:12px;right:12px;z-index:10;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.12);color:var(--text3);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:all 0.25s}
.project-card:hover .pc-delete{opacity:1}
.project-card .pc-delete:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.project-card .pc-image{aspect-ratio:4/3;background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.project-card .pc-image img{width:100%;height:100%;object-fit:cover;transition:transform 0.6s cubic-bezier(0.22,1,0.36,1)}
.project-card:hover .pc-image img{transform:scale(1.06)}
.project-card .pc-image .placeholder{font-size:36px;opacity:0.08;color:#fff;font-family:var(--font-serif)}
.project-card .pc-image .pc-tag{position:absolute;top:14px;left:14px;padding:4px 12px;background:rgba(0,0,0,0.75);color:var(--accent);font-size:9px;letter-spacing:1px;font-weight:600;text-transform:uppercase}
.project-card .pc-body{padding:28px}
.project-card .pc-body .pc-meta{font-family:var(--font-mono);font-size:9px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
.project-card .pc-body h3{font-family:var(--font-serif);font-size:20px;font-weight:500;margin-bottom:4px;color:#fff;letter-spacing:-0.3px}
.project-card .pc-body .pc-en{font-size:10px;color:var(--text3);letter-spacing:0.5px;margin-bottom:14px;font-style:italic}
.project-card .pc-body p{font-size:12.5px;color:var(--text2);line-height:1.65;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;display:-webkit-box}
.add-project-btn{display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px dashed var(--border);cursor:pointer;transition:all 0.4s;min-height:200px;flex-direction:column;gap:12px}
.add-project-btn:hover{border-color:var(--accent);background:var(--surface2);transform:translateY(-4px)}
.add-project-btn .plus{font-size:40px;color:var(--text3);transition:color 0.3s;font-weight:300;line-height:1}
.add-project-btn:hover .plus{color:var(--accent)}
.add-project-btn span{font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;font-weight:500}

/* ======== MODAL ======== */
.modal-overlay{position:fixed;inset:0;z-index:300;background:rgba(4,4,6,0.94);display:flex;align-items:center;justify-content:center;padding:32px;opacity:0;pointer-events:none;transition:opacity 0.35s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--surface);max-width:820px;width:100%;max-height:85vh;overflow-y:auto;padding:48px;position:relative;border:1px solid var(--border)}
.modal-close{position:absolute;top:20px;right:20px;width:40px;height:40px;background:rgba(255,255,255,0.04);border:none;color:#fff;font-size:18px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;border-radius:50%}
.modal-close:hover{background:var(--accent)}
.modal .m-cat{font-family:var(--font-mono);font-size:9px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:12px}
.modal h2{font-family:var(--font-serif);font-size:clamp(24px,3.5vw,34px);font-weight:400;margin-bottom:6px;color:#fff;letter-spacing:-0.5px}
.modal .m-sub{font-size:11px;color:var(--text3);margin-bottom:32px}
.modal .m-section{margin-bottom:24px}
.modal .m-section h4{font-family:var(--font-sans);font-size:10px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:10px;font-weight:600}
.modal .m-section p,.modal .m-section li{font-size:14px;color:var(--text2);line-height:1.85;font-weight:300}
.modal .m-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.modal .m-tags span{padding:5px 16px;background:rgba(255,255,255,0.03);font-size:11px;color:var(--text2);border:1px solid var(--border)}
.modal .m-gallery{margin-top:36px}
.modal .m-gallery h4{font-family:var(--font-sans);font-size:10px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:16px;font-weight:600}
.modal .m-gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.modal .m-gallery-grid .g-item{aspect-ratio:4/3;background:var(--surface2);cursor:pointer;overflow:hidden;transition:transform 0.3s}
.modal .m-gallery-grid .g-item:hover{transform:translateY(-2px)}
.modal .m-gallery-grid .g-item img{width:100%;height:100%;object-fit:cover;transition:transform 0.3s}
.modal .m-gallery-grid .g-item:hover img{transform:scale(1.06)}
.modal .m-gallery-grid .g-item.add{display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:24px;cursor:pointer;border:1px dashed var(--border)}
.modal .m-gallery-grid .g-item.add:hover{color:var(--accent);border-color:var(--accent)}
.modal .m-hero-img{width:100%;aspect-ratio:21/9;overflow:hidden;margin-bottom:32px;border:1px solid var(--border);cursor:pointer}
.modal .m-hero-img img{width:100%;height:100%;object-fit:cover;transition:transform 0.4s}
.modal .m-hero-img:hover img{transform:scale(1.02)}
.modal .m-hero-placeholder{width:100%;aspect-ratio:21/9;background:var(--surface2);display:flex;align-items:center;justify-content:center;margin-bottom:32px;border:1px solid var(--border);font-family:var(--font-serif);font-size:3rem;color:var(--text3);letter-spacing:4px}
.modal .m-two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.modal .m-header{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.modal .m-gallery-grid .g-item{position:relative}
.modal .m-gallery-grid .g-item .g-badge{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,0.7);color:#fff;font-size:9px;padding:2px 8px;font-family:var(--font-mono);letter-spacing:1px}
.modal .m-gallery-grid .g-item.main .g-badge{background:var(--accent)}
/* Gallery admin controls */
.g-del{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.15);color:#f66;font-size:14px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:5;line-height:1}
.g-move-left,.g-move-right{position:absolute;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:12px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:5;line-height:1}
.g-move-left{left:6px}.g-move-right{right:6px}
body.admin .g-del,body.admin .g-move-left,body.admin .g-move-right{display:flex}
.modal .m-gallery-grid .g-item:hover .g-del,
.modal .m-gallery-grid .g-item:hover .g-move-left,
.modal .m-gallery-grid .g-item:hover .g-move-right{display:flex}
.modal .m-gallery-grid .g-item.add{display:none}
body.admin .modal .m-gallery-grid .g-item.add{display:flex}
.g-del:hover{background:#f44;color:#fff;border-color:#f44}
.g-move-left:hover,.g-move-right:hover{background:var(--accent);border-color:var(--accent)}

.lightbox{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.96);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s}
.lightbox.open{opacity:1;pointer-events:auto}
.lightbox img{max-width:92vw;max-height:88vh}
.lightbox-close{position:absolute;top:24px;right:24px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.06);border:none;color:#fff;font-size:20px;cursor:pointer}

.add-modal{position:fixed;inset:0;z-index:350;background:rgba(4,4,6,0.94);display:flex;align-items:center;justify-content:center;padding:32px;opacity:0;pointer-events:none;transition:opacity 0.35s}
.add-modal.open{opacity:1;pointer-events:auto}
.add-modal-inner{background:var(--surface);max-width:600px;width:100%;max-height:85vh;overflow-y:auto;padding:40px;border:1px solid var(--border)}
.add-modal-inner h3{font-family:var(--font-serif);font-size:22px;font-weight:400;color:#fff;margin-bottom:24px;letter-spacing:-0.3px}
.add-modal-inner .af-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.add-modal-inner .af-full{margin-bottom:14px}
.add-modal-inner label{display:block;font-size:9px;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px;font-weight:500}
.add-modal-inner input,.add-modal-inner textarea{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:12.5px;font-family:var(--font-sans);transition:border-color 0.2s;font-weight:300}
.add-modal-inner textarea{min-height:60px;resize:vertical;line-height:1.6}
.add-modal-inner input:focus,.add-modal-inner textarea:focus{outline:none;border-color:var(--accent)}
.add-modal-actions{display:flex;gap:10px;margin-top:24px}
.add-modal-actions button{flex:1;padding:13px;font-size:11px;font-weight:600;border:none;cursor:pointer;font-family:var(--font-sans);letter-spacing:1px;text-transform:uppercase;transition:all 0.25s}
.add-modal-actions .save{background:var(--accent);color:#fff}
.add-modal-actions .save:hover{filter:brightness(1.15)}
.add-modal-actions .cancel{background:rgba(255,255,255,0.03);color:var(--text2);border:1px solid var(--border)}
.add-modal-actions .cancel:hover{border-color:var(--accent);color:var(--accent)}

/* ======== ABOUT ======== */
.about-photo-area{display:flex;align-items:center;gap:28px;margin-bottom:48px;padding:24px 32px;background:var(--surface);border:1px solid var(--border)}
.about-photo{width:100px;height:100px;border-radius:50%;overflow:hidden;flex-shrink:0;cursor:pointer;position:relative;background:var(--surface2);border:2px solid var(--border);transition:all 0.3s;display:flex;align-items:center;justify-content:center}
.about-photo:hover{border-color:var(--accent);transform:scale(1.05)}
.about-photo img{width:100%;height:100%;object-fit:cover}
.about-photo .ph-placeholder{font-family:var(--font-serif);font-size:36px;color:var(--accent);opacity:0.3;font-weight:500}
.about-photo .ph-upload{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);font-size:10px;color:#fff;letter-spacing:1px;text-transform:uppercase}
body.admin .about-photo .ph-upload{display:flex;opacity:0;transition:opacity 0.3s}
body.admin .about-photo:hover .ph-upload{opacity:1}
body.admin .about-photo{cursor:pointer}
body:not(.admin) .about-photo{cursor:default;pointer-events:none}
.about-photo-info h4{font-size:16px;color:#fff;font-weight:500;letter-spacing:-0.2px;margin-bottom:4px}
.about-photo-info p{font-size:11px;color:var(--text3);font-weight:300}
.about-grid{display:grid;grid-template-columns:1.2fr 0.8fr;gap:72px;align-items:start}
.about-bio p{font-size:15px;color:var(--text2);line-height:1.9;margin-bottom:22px;font-weight:300}
.about-bio p:first-child::first-letter{font-size:3.5em;font-family:var(--font-serif);float:left;line-height:0.8;margin-right:12px;margin-top:4px;color:var(--accent)}
.about-side{position:relative}
.edu-item{padding:14px 0;border-bottom:1px solid var(--border);position:relative}
.edu-item:last-child{border-bottom:none}
.edu-item:hover .item-del{opacity:1}
.education-add{margin-top:12px}
.edu-degree{font-size:15px;font-weight:500;color:#fff}
.edu-school{font-size:12px;color:var(--text3);margin-top:4px}.edu-year{font-size:10px;color:var(--accent);letter-spacing:1px;margin-top:2px}
.philosophy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:72px}
.philo-item{padding:36px 28px;background:var(--surface);transition:all 0.4s;position:relative;overflow:hidden}
.philo-item:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.philo-item:hover .item-del{opacity:1}
.philo-item::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform 0.5s}
.philo-item:hover::before{transform:scaleX(1)}
.philo-item h4{font-family:var(--font-serif);font-size:20px;font-weight:500;margin-bottom:4px;color:#fff;letter-spacing:-0.3px}
.philo-item .en{font-size:9px;color:var(--text3);letter-spacing:1.5px;margin-bottom:14px;text-transform:uppercase}
.philo-item p{font-size:13px;color:var(--text2);line-height:1.75;font-weight:300}

/* ======== EXPERIENCE ======== */
.timeline{position:relative;padding-left:36px;max-width:720px}
.timeline::before{content:'';position:absolute;left:0;top:6px;bottom:0;width:1px;background:var(--border)}
.timeline-item{position:relative;padding-bottom:48px;transition:transform 0.3s}
.timeline-item:hover{transform:translateX(4px)}
.timeline-item:hover .item-del{opacity:1}
.timeline-item::before{content:'';position:absolute;left:-40px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-dim)}
.timeline-item .period{font-family:var(--font-mono);font-size:10px;color:var(--accent);letter-spacing:2px;margin-bottom:8px}
.timeline-item h4{font-size:19px;font-weight:500;color:#fff;letter-spacing:-0.3px}
.timeline-item .company{font-size:13px;color:var(--text3);margin-bottom:12px}
.timeline-item p{font-size:14px;color:var(--text2);line-height:1.8;font-weight:300}

/* ======== SKILLS ======== */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px}
.skill-item{padding:28px 24px;background:var(--surface);transition:transform 0.4s,background 0.4s,box-shadow 0.4s;position:relative}
.skill-item:hover{background:var(--surface2);transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.skill-item:hover .item-del{opacity:1}
.skill-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.skill-name{font-size:14px;font-weight:500;color:#fff;letter-spacing:-0.2px}
.skill-pct{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:600}
.skill-bar{height:2.5px;background:rgba(255,255,255,0.06);margin-bottom:14px;overflow:hidden}
.skill-bar-fill{height:100%;background:var(--accent);width:0;transition:width 1.6s cubic-bezier(0.16,1,0.3,1)}
.skill-desc{font-size:12px;color:var(--text3);line-height:1.7;font-weight:300}

/* ======== PROCESS ======== */
.process-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px}
.process-item{padding:36px 28px;background:var(--surface);transition:transform 0.4s,background 0.4s;position:relative}
.process-item:hover{background:var(--surface2);transform:translateY(-4px)}
.process-item:hover .item-del{opacity:1}
.process-item .step-num{font-family:var(--font-serif);font-size:56px;color:var(--accent);opacity:0.08;line-height:1;margin-bottom:8px}
.process-item h4{font-size:16px;font-weight:500;color:#fff;margin-bottom:4px}
.process-item .en{font-size:9px;color:var(--text3);letter-spacing:1px;margin-bottom:12px;text-transform:uppercase}
.process-item p{font-size:13px;color:var(--text2);line-height:1.75;font-weight:300}

/* ======== SERVICES ======== */
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px}
.service-item{padding:36px 28px;background:var(--surface);transition:all 0.4s;position:relative}
.service-item:hover{background:var(--surface2);transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.service-item:hover .item-del{opacity:1}
.service-item .s-icon{font-family:var(--font-mono);font-size:20px;color:var(--accent);margin-bottom:16px;opacity:0.5}
.service-item h4{font-size:16px;font-weight:500;color:#fff;margin-bottom:4px;letter-spacing:-0.2px}
.service-item .s-en{font-size:9px;color:var(--text3);letter-spacing:1px;margin-bottom:12px;text-transform:uppercase}
.service-item p{font-size:13px;color:var(--text2);line-height:1.75;font-weight:300}

/* ======== CASES ======== */
.cases-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px}
.case-item{padding:36px 28px;background:var(--surface);transition:transform 0.4s,background 0.4s;position:relative}
.case-item:hover{background:var(--surface2);transform:translateY(-4px)}
.case-item:hover .item-del{opacity:1}
.case-item h4{font-size:17px;font-weight:500;color:#fff;margin-bottom:14px;letter-spacing:-0.3px}
.case-item p{font-size:14px;color:var(--text2);line-height:1.8;margin-bottom:20px;font-weight:300}
.case-metric{display:inline-flex;padding:6px 18px;background:var(--accent-dim);color:var(--accent);font-size:10.5px;font-weight:600;letter-spacing:0.5px}

/* ======== TESTIMONIALS ======== */
.testimonials-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}
.testimonial-item{padding:44px 36px;background:var(--surface);position:relative;transition:transform 0.4s,background 0.4s}
.testimonial-item:hover{background:var(--surface2);transform:translateY(-4px)}
.testimonial-item:hover .item-del{opacity:1}
.testimonial-item .quote{font-family:var(--font-serif);font-size:16px;font-style:italic;color:var(--text2);line-height:1.7;margin-bottom:28px}
.testimonial-item .author{font-size:14px;font-weight:500;color:#fff}
.testimonial-item .role{font-size:10.5px;color:var(--text3);margin-top:4px}

/* ======== INSIGHTS ======== */
.insights-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}
.insight-item{padding:36px 28px;background:var(--surface);cursor:pointer;transition:all 0.4s;position:relative}
.insight-item:hover{background:var(--surface2);transform:translateY(-4px)}
.insight-item:hover .item-del{opacity:1}
.insight-item .date{font-family:var(--font-mono);font-size:9px;color:var(--accent);letter-spacing:2px;margin-bottom:14px}
.insight-item h4{font-family:var(--font-serif);font-size:18px;font-weight:500;color:#fff;margin-bottom:10px;line-height:1.35;letter-spacing:-0.3px}
.insight-item p{font-size:13px;color:var(--text2);line-height:1.75;font-weight:300}

/* ======== FAQ ======== */
.faq-list{max-width:700px}
.faq-item{border-bottom:1px solid var(--border);cursor:pointer;position:relative}
.faq-q{padding:24px 36px 24px 0;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:500;color:#fff;letter-spacing:-0.2px;transition:color 0.2s}
.faq-q:hover{color:var(--accent)}
.faq-q .arrow{font-size:16px;color:var(--text3);transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1)}
.faq-item.open .faq-q .arrow{transform:rotate(45deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height 0.5s cubic-bezier(0.22,1,0.36,1),padding 0.5s}
.faq-item.open .faq-a{max-height:400px;padding-bottom:24px}
.faq-a p{font-size:14px;color:var(--text2);line-height:1.85;font-weight:300}

/* ======== CONTACT ======== */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:72px}
.contact-info p{font-size:14px;color:var(--text2);line-height:1.85;margin-bottom:36px;font-weight:300}
.contact-detail{display:flex;gap:18px;margin-bottom:18px;align-items:flex-start}
.contact-detail .icon{width:16px;font-size:20px;color:var(--accent);flex-shrink:0;text-align:center;line-height:1.5}
.contact-detail .val{font-size:14px;color:var(--text);font-weight:300}
.contact-form{display:flex;flex-direction:column;gap:14px}
.contact-form input,.contact-form textarea{padding:16px 18px;background:var(--surface);border:1px solid var(--border);color:#fff;font-size:13px;font-family:var(--font-sans);transition:border-color 0.3s;resize:vertical}
.contact-form input:focus,.contact-form textarea:focus{outline:none;border-color:var(--accent)}
.contact-form textarea{min-height:140px}
.contact-form .btn-primary{width:100%;justify-content:center}
.contact-success{display:none;text-align:center;padding:40px 0}
.contact-success h3{font-family:var(--font-serif);font-size:28px;color:var(--accent);margin-bottom:12px}
.contact-success p{font-size:14px;color:var(--text2)}

/* ======== FOOTER ======== */
.footer{max-width:1040px;margin:0 auto;width:100%;padding:40px 48px 60px;position:relative;z-index:2;text-align:center;border-top:1px solid var(--border)}
.footer .copy{font-size:10px;color:var(--text3);letter-spacing:1px;font-weight:300}

/* ======== BACKGROUND SETTINGS ======== */
.bg-settings-btn{position:fixed;bottom:40px;right:48px;z-index:90;width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all 0.3s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bg-settings-btn:hover{border-color:var(--accent);color:var(--accent);transform:rotate(30deg);box-shadow:0 4px 20px var(--accent-dim)}
.bg-panel-overlay{position:fixed;inset:0;z-index:580;background:rgba(0,0,0,0.45);opacity:0;pointer-events:none;transition:opacity 0.3s}
.bg-panel-overlay.open{opacity:1;pointer-events:auto}
.bg-panel{position:fixed;right:-460px;top:50%;transform:translateY(-50%);width:420px;z-index:590;background:var(--surface);color:var(--text);padding:32px;transition:right 0.5s cubic-bezier(0.22,1,0.36,1);border:1px solid var(--border);max-height:80vh;overflow-y:auto}
.bg-panel.open{right:48px}
.bg-panel h3{font-family:var(--font-sans);font-size:11px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.bg-panel h3 button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;transition:color 0.2s}
.bg-panel h3 button:hover{color:var(--accent)}
.bg-panel .bg-field{margin-bottom:20px}
.bg-panel .bg-field label{display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;font-weight:500}
.bg-panel .bg-field label span{color:var(--accent);font-family:var(--font-mono);font-size:11px}
.bg-panel .bg-field input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;outline:none}
.bg-panel .bg-field input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}
.bg-panel .bg-field select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:12px;font-family:var(--font-sans);cursor:pointer;transition:border-color 0.2s}
.bg-panel .bg-field select:focus{outline:none;border-color:var(--accent)}
.bg-panel .bg-actions{display:flex;gap:10px;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
.bg-panel .bg-actions button{flex:1;padding:11px;font-size:10px;font-weight:600;border:none;cursor:pointer;transition:all 0.25s;font-family:var(--font-sans);letter-spacing:1px;text-transform:uppercase}
.bg-panel .bg-actions .bg-reset{background:rgba(255,255,255,0.03);color:var(--text2);border:1px solid var(--border)}
.bg-panel .bg-actions .bg-reset:hover{border-color:var(--accent);color:var(--accent)}

/* ======== CMS ======== */
.cms-overlay{position:fixed;inset:0;z-index:490;background:rgba(0,0,0,0.55);opacity:0;pointer-events:none;transition:opacity 0.3s}
.cms-overlay.open{opacity:1;pointer-events:auto}
.cms-panel{position:fixed;right:-560px;top:0;bottom:0;width:480px;z-index:500;background:var(--surface);color:var(--text);overflow-y:auto;padding:36px 28px;transition:right 0.5s cubic-bezier(0.22,1,0.36,1);border-left:1px solid var(--border)}
.cms-panel.open{right:0}
.cms-panel h3{font-family:var(--font-sans);font-size:10px;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.cms-panel h3 button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;transition:color 0.2s}
.cms-panel h3 button:hover{color:var(--accent)}
.cms-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:10px}
.cms-tab{padding:6px 12px;font-size:9px;color:var(--text3);cursor:pointer;border-radius:2px;transition:all 0.2s;letter-spacing:0.5px;text-transform:uppercase;font-weight:500;background:none;border:none;font-family:var(--font-sans)}
.cms-tab:hover{color:var(--text)}
.cms-tab.active{background:var(--accent-dim);color:var(--accent)}
.cms-search{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:11px;margin-bottom:18px;font-family:var(--font-sans);transition:border-color 0.2s;font-weight:300}
.cms-search:focus{outline:none;border-color:var(--accent)}
.cms-toggle-all{font-size:9px;color:var(--accent);cursor:pointer;margin-left:auto;letter-spacing:1px;background:none;border:none;font-family:var(--font-sans);text-transform:uppercase;font-weight:500;padding:4px 8px}
.cms-toggle-all:hover{text-decoration:underline}
.cms-section{margin-bottom:24px}
.cms-section h4{font-family:var(--font-sans);font-size:9px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:12px;font-weight:600;display:flex;align-items:center;cursor:pointer;user-select:none}
.cms-section h4 .collapse-icon{font-size:10px;margin-right:6px;transition:transform 0.3s;display:inline-block}
.cms-section.collapsed .collapse-icon{transform:rotate(-90deg)}
.cms-section .cms-body{overflow:hidden;transition:max-height 0.4s ease}
.cms-section.collapsed .cms-body{max-height:0!important}
.cms-field{margin-bottom:14px}
.cms-field label{display:block;font-size:10px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;font-weight:500}
.cms-field input,.cms-field textarea{width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:12.5px;font-family:var(--font-sans);transition:border-color 0.2s;font-weight:300}
.cms-field textarea{min-height:56px;resize:vertical;line-height:1.6}
.cms-field input:focus,.cms-field textarea:focus{outline:none;border-color:var(--accent)}
.cms-hint{font-size:9px;color:var(--text3);margin-top:4px}
.cms-actions{display:flex;gap:10px;margin-top:28px;padding-top:18px;border-top:1px solid var(--border)}
.cms-btn{flex:1;padding:13px;font-size:11px;font-weight:600;border:none;cursor:pointer;transition:all 0.25s;font-family:var(--font-sans);letter-spacing:1px;text-transform:uppercase}
.cms-btn.save{background:var(--accent);color:#fff}
.cms-btn.save:hover{filter:brightness(1.15)}
.cms-btn.reset{background:rgba(255,255,255,0.03);color:var(--text2);border:1px solid var(--border)}
.cms-btn.reset:hover{border-color:var(--accent);color:var(--accent)}
.cms-btn.add-proj{background:rgba(255,255,255,0.03);color:var(--accent);border:1px dashed var(--accent);margin-bottom:14px;width:100%}
.cms-btn.add-proj:hover{background:var(--accent-dim)}

/* ======== EXPORT ======== */
.export-overlay{position:fixed;inset:0;z-index:550;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;padding:30px;opacity:0;pointer-events:none;transition:opacity 0.3s}
.export-overlay.open{opacity:1;pointer-events:auto}
.export-card{background:var(--surface);max-width:540px;width:100%;padding:40px;border:1px solid var(--border)}
.export-card h3{font-family:var(--font-serif);font-size:24px;font-weight:400;color:#fff;margin-bottom:8px;letter-spacing:-0.3px}
.export-card .ex-note{font-size:12px;color:var(--text3);margin-bottom:24px}
.export-theme-select{margin-bottom:20px}
.export-theme-select label{font-size:9px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:10px}
.export-theme-select .et-grid{display:flex;gap:8px;flex-wrap:wrap}
.export-preview-btn{width:100%;padding:10px;margin-top:8px;background:rgba(255,255,255,0.03);border:1px solid var(--border);color:var(--text2);font-size:10px;cursor:pointer;font-family:var(--font-sans);text-transform:uppercase;letter-spacing:1px;transition:all 0.2s}
.export-preview-btn:hover{border-color:var(--accent);color:var(--accent)}
.export-theme-select .et-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;transition:all 0.2s;border:2px solid transparent;position:relative}
.export-theme-select .et-dot:hover{transform:scale(1.15)}
.export-theme-select .et-dot.active{border-color:#fff;box-shadow:0 0 14px currentColor}
.export-options{display:flex;flex-direction:column;gap:10px}
.export-option{display:flex;align-items:center;gap:20px;padding:20px;background:var(--surface2);cursor:pointer;transition:all 0.25s;border-left:3px solid transparent}
.export-option:hover{border-left-color:var(--accent);background:rgba(255,255,255,0.03)}
.export-option .eo-icon{font-size:28px}
.export-option .eo-body h4{font-size:15px;font-weight:500;color:#fff}
.export-option .eo-body p{font-size:11px;color:var(--text3);margin-top:4px;font-weight:300}
.export-cancel{display:block;width:100%;margin-top:18px;padding:13px;background:transparent;border:1px solid var(--border);color:var(--text2);font-size:12px;cursor:pointer;text-align:center;font-family:var(--font-sans);transition:all 0.2s;text-transform:uppercase;letter-spacing:1px}
.export-cancel:hover{border-color:var(--accent);color:var(--accent)}
.export-preview{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.35s}
.export-preview.open{opacity:1;pointer-events:auto}
.export-preview-inner{background:var(--bg);max-width:900px;width:95%;max-height:85vh;overflow-y:auto;padding:40px;border:1px solid var(--border);position:relative}
.export-preview-inner h3{font-family:var(--font-serif);font-size:20px;color:#fff;margin-bottom:18px}
.export-preview-inner .pv-actions{display:flex;gap:10px;margin-top:24px}
.export-preview-inner .pv-actions button{flex:1;padding:12px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font-sans);border:none;text-transform:uppercase;letter-spacing:1px;transition:all 0.2s}
.export-preview-inner .pv-confirm{background:var(--accent);color:#fff}
.export-preview-inner .pv-confirm:hover{filter:brightness(1.15)}
.export-preview-inner .pv-back{background:rgba(255,255,255,0.03);color:var(--text2);border:1px solid var(--border)}
.export-preview-inner .pv-back:hover{border-color:var(--accent);color:var(--accent)}

/* ======== TOAST ======== */
#toastContainer{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:12px 32px;background:var(--surface2);color:var(--text);font-size:12px;border:1px solid var(--border);animation:toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1),toastOut 0.35s 2.5s ease forwards;letter-spacing:0.5px}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-8px)}}

.divider{width:60px;height:1px;background:var(--accent);opacity:0.25;margin:0 auto}

/* ======== RESPONSIVE ======== */
@media(max-width:1280px){
  .hero-section,.section,.stats-row,.footer{max-width:100%}
  .hero-headline{font-size:clamp(32px,6vw,64px)}
  .projects-grid{grid-template-columns:repeat(2,1fr)}
  .process-grid,.services-grid,.cases-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){

(function(){
  const c = document.getElementById('bgCanvas'), ctx = c.getContext('2d');
  const gc = document.getElementById('glowCanvas'), gctx = gc.getContext('2d');
  let w, h, pts = [], stars = [], mouseX = -999, mouseY = -999, frame = 0;
  function resize(){ w=c.width=gc.width=window.innerWidth; h=c.height=gc.height=window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  function initParticles(count){
    pts = [];
    const sz = bgSettings.size;
    for(let i=0;i<count;i++) pts.push({
      x:Math.random()*w, y:Math.random()*h,
      r:Math.random()*sz*1.2+sz*0.3,
      vx:(Math.random()-0.5)*0.35, vy:(Math.random()-0.5)*0.35,
      ox:0, oy:0
    });
  }
  function initStars(count){
    stars = [];
    for(let i=0;i<count;i++) stars.push({
      x:Math.random()*w, y:Math.random()*h,
      r:Math.random()*bgSettings.size*0.8+bgSettings.size*0.15,
      twinkle:Math.random()*Math.PI*2,
      speed:0.02+Math.random()*0.04
    });
  }

  function refreshParticles(){
    const count = bgSettings.count;
    if(bgSettings.style === 'stars'){
      initStars(count*3);
    } else {
      initParticles(count);
    }
  }
  refreshParticles();
  window._reinitCanvas = function(){
    refreshParticles();
    currentHue = targetHue;
  };

  document.addEventListener('mousemove', function(e){ mouseX=e.clientX; mouseY=e.clientY; });
  document.addEventListener('mouseleave', function(){ mouseX=-999; mouseY=-999; });

  function draw(){
    ctx.clearRect(0,0,w,h);
    gctx.clearRect(0,0,w,h);

    const dh = targetHue - currentHue;
    if(Math.abs(dh) > 0.3) currentHue += dh * 0.06;
    else currentHue = targetHue;
    const hue = currentHue;

    const style = bgSettings.style;

    if(style === 'grid'){
      const gridSize = 50;
      ctx.strokeStyle = 'hsla('+hue+',20%,20%,0.04)';
      ctx.lineWidth = 0.5;
      for(let x=gridSize;x<w;x+=gridSize){
        ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();
      }
      for(let y=gridSize;y<h;y+=gridSize){
        ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
      }
      for(let x=gridSize;x<w;x+=gridSize){
        for(let y=gridSize;y<h;y+=gridSize){
          ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);
          ctx.fillStyle='hsla('+hue+',30%,40%,0.08)';ctx.fill();
        }
      }
    } else {
      const cx = w*0.5 + Math.sin(frame*0.0004)*w*0.25;
      const cy = h*0.55 + Math.cos(frame*0.00035)*h*0.2;
      const g = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*0.9);
      g.addColorStop(0,'hsla('+hue+',30%,9%,0.6)');
      g.addColorStop(0.45,'hsla('+(hue+20)+',25%,5%,0.4)');
      g.addColorStop(1,'hsla('+(hue-10)+',15%,2%,0.7)');
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    }

    const gs = bgSettings.glowStrength;
    if(mouseX > -1 && gs > 0.001){
      const gm = gctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 350);
      gm.addColorStop(0, 'hsla('+hue+',50%,50%,'+(gs*0.12)+')');
      gm.addColorStop(1, 'hsla('+hue+',50%,50%,0)');
      gctx.fillStyle=gm; gctx.fillRect(0,0,w,h);
    }

    if(style === 'stars'){
      for(let i=0;i<stars.length;i++){
        const s = stars[i];
        s.twinkle += s.speed;
        const alpha = 0.3 + Math.sin(s.twinkle)*0.3;
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fillStyle='hsla('+hue+',50%,70%,'+alpha+')'; ctx.fill();
      }
    } else if(style !== 'grid'){
      for(let i=0;i<pts.length;i++){
        const p = pts[i];
        if(mouseX > -1){
          const dx = mouseX - p.x, dy = mouseY - p.y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if(dist < 200){
            const f = (1 - dist/200) * 0.03;
            p.ox += dx * f; p.oy += dy * f;
          }
        }
        p.x += p.vx + p.ox; p.y += p.vy + p.oy;
        p.ox *= 0.92; p.oy *= 0.92;
        if(p.x<0||p.x>w) p.vx*=-1; if(p.y<0||p.y>h) p.vy*=-1;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle='hsla('+hue+',50%,55%,0.12)'; ctx.fill();
        if(style === 'particle-line'){
          const lo = bgSettings.lineOpacity;
          for(let j=i+1;j<pts.length;j++){
            const q=pts[j], dx2=p.x-q.x, dy2=p.y-q.y;
            const dist2=Math.sqrt(dx2*dx2+dy2*dy2);
            if(dist2<130){
              ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y);
              ctx.strokeStyle='hsla('+hue+',50%,50%,'+(lo*(1-dist2/130))+')'; ctx.stroke();
            }
          }
        }
      }
    }
    frame++; requestAnimationFrame(draw);
  }
  draw();
})();

/* ======== FONT SYSTEM ======== */
function updateFontSetting(key, val){
  if(!D.fontSettings) D.fontSettings = {};
  D.fontSettings[key] = val;
  applyFontSettings();
  persist();
  publishToGitHub(function(){});
}

function loadGoogleFont(name){
  if(!name || loadedFonts[name]) return;
  loadedFonts[name] = true;
  var link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?family='+encodeURIComponent(name.replace(/ /g,'+'))+':wght@300;400;500;600;700&display=swap';
  document.head.appendChild(link);
}

function applyFontSettings(){
  var fs = D.fontSettings || {};
  var root = document.documentElement;
  if(fs.bodyFont){ loadGoogleFont(fs.bodyFont); root.style.setProperty('--font-sans', "'"+fs.bodyFont+"','Noto Sans SC',sans-serif"); }
  if(fs.headingFont){ loadGoogleFont(fs.headingFont); root.style.setProperty('--font-serif', "'"+fs.headingFont+"','Noto Serif SC',serif"); }
  if(fs.monoFont){ loadGoogleFont(fs.monoFont); root.style.setProperty('--font-mono', "'"+fs.monoFont+"','SF Mono',monospace"); }
  if(fs.bodySize){ document.body.style.fontSize = fs.bodySize+'px'; }
  if(fs.headingWeight){
    var hw = fs.headingWeight;
    document.querySelectorAll('.section-title,.hero-headline,.logo,.stat-value,.timeline-item h4,.project-card h3,.service-item h4,.case-item h4,.insight-item h4,.process-item h4').forEach(function(el){el.style.fontWeight=hw});
  }
  if(fs.letterSpacing){ document.body.style.letterSpacing = fs.letterSpacing+'px'; }
  if(fs.lineHeight){ document.body.style.lineHeight = fs.lineHeight; }
}

function resetFonts(){
  D.fontSettings = {};
  document.body.style.fontSize = '';
  document.body.style.lineHeight = '';
  document.body.style.letterSpacing = '';
  var root = document.documentElement;
  root.style.removeProperty('--font-sans');
  root.style.removeProperty('--font-serif');
  root.style.removeProperty('--font-mono');
  document.querySelectorAll('.section-title,.hero-headline,.logo,.stat-value,.timeline-item h4,.project-card h3,.service-item h4,.case-item h4,.insight-item h4,.process-item h4').forEach(function(el){el.style.fontWeight=''});
  persist();
  toast('字体已恢复默认');
}

/* ======== FLAT GETTER/SETTER ======== */
function get(dp){
  const keys=dp.split('.'); let v=D;
  for(let k of keys){
    if(v===undefined||v===null) return '';
    if(/^\d+$/.test(k)) v=v[parseInt(k)];
    else v=v[k];
  }
  return v===undefined||v===null?'':v;
}
function set(dp,val){
  const keys=dp.split('.'), last=keys.pop(); let obj=D;
  for(let k of keys){
    if(/^\d+$/.test(k)) obj=obj[parseInt(k)];
    else obj=obj[k];
  }
  if(/^\d+$/.test(last)) obj[parseInt(last)]=val;
  else obj[last]=val;
}

/* ======== STAT COUNTING ANIMATION ======== */
function animateStats(){
  document.querySelectorAll('.stat-value').forEach(function(el){
    const text = el.textContent;
    const numMatch = text.match(/^([\d.]+)(.*)$/);
    if(!numMatch) return;
    const target = parseFloat(numMatch[1]);
    const suffix = numMatch[2] || '';
    if(isNaN(target)) return;
    let current = 0;
    const duration = 1800, step = 16;
    const increment = target / (duration / step);
    const timer = setInterval(function(){
      current += increment;
      if(current >= target){ current = target; clearInterval(timer); }
      const display = target%1===0 ? Math.floor(current) : current.toFixed(1);
      el.textContent = display + suffix;
    }, step);
  });
}

    }
  });
}

  D.projects = D.projects.filter(function(p){return p.id!==id});
  delete projectImages[id];
  renderProjects();
  persist();
  toast('项目已删除');
}

function deleteProjectImage(id, index){
  if(!projectImages[id]) return;
  projectImages[id].splice(index, 1);
  if(projectImages[id].length === 0) delete projectImages[id];
  var p = D.projects.find(function(x){return x.id===id});
  if(p && p.imgs) p.imgs.splice(index, 1);
  persist(); publishToGitHub(function(){});
  openProject(id); renderProjects();
}

function moveProjectImage(id, from, to){
  if(!projectImages[id]) return;
  var arr = projectImages[id];
  var item = arr.splice(from, 1)[0];
  arr.splice(to, 0, item);
  var p = D.projects.find(function(x){return x.id===id});
  if(p && p.imgs){
    var mi = p.imgs.splice(from, 1)[0];
    p.imgs.splice(to, 0, mi);
  }
  persist(); publishToGitHub(function(){});
  openProject(id); renderProjects();
}

function uploadProjectImg(id, inp){
  if(!isAdmin()){ toast('请先登录编辑模式'); return; }
  var files=Array.from(inp.files);
  if(!files.length) return;
  if(!projectImages[id]) projectImages[id]=[];
  var p = D.projects.find(function(x){return x.id===id});
  if(p && !p.imgs) p.imgs = [];
  var total = files.length, done = 0;
  files.forEach(function(f){
    var r=new FileReader();
    r.onload=function(e){
      var dataUrl = e.target.result;
      projectImages[id].push(dataUrl);
      if(p) p.imgs.push(dataUrl);
      done++;
      if(done >= total){
        // Close and reopen for clean refresh
        closeProject();
        setTimeout(function(){
          openProject(id); renderProjects(); persist(); publishToGitHub(function(){});
        }, 50);
      }
      // Upload to cloud in background
      var ext = (f.name.split('.').pop() || 'jpg').toLowerCase();
      if(ext==='jpeg') ext = 'jpg';
      var filename = 'proj_'+id+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)+'.'+ext;
      uploadImageToGitHub(dataUrl, filename, function(url){
        if(url){
          var idx = projectImages[id].indexOf(dataUrl);
          if(idx>=0) projectImages[id][idx] = url;
          if(p && p.imgs){
            var idx2 = p.imgs.indexOf(dataUrl);
            if(idx2>=0) p.imgs[idx2] = url;
          }
          persist(); publishToGitHub(function(){});
          closeProject();
          setTimeout(function(){ openProject(id); renderProjects(); }, 50);
        }
      });
    };
    r.readAsDataURL(f);
  });
}

    r.onload=function(e){

        persist(); renderProjects(); publishToGitHub(function(){});

  else if(module==='insights') label = arr[index].title;
  else if(module==='faq') label = arr[index].q;

    case 'education': item = {degree:gv('ga_degree')||'新学历', school:gv('ga_school')||'', year:gv('ga_year')||''}; break;

function switchTab(tab){
  cmsTab = tab;
  document.querySelectorAll('.cms-tab').forEach(function(t){t.classList.toggle('active', t.dataset.tab===tab)});
  document.getElementById('cmsTabContent').innerHTML = buildTabContent(tab);
  document.getElementById('cmsSearch').value = '';
}

function filterCMS(){
  var q = document.getElementById('cmsSearch').value.toLowerCase();
  var fields = document.querySelectorAll('#cmsTabContent .cms-field');
  var sections = document.querySelectorAll('#cmsTabContent .cms-section');
  sections.forEach(function(sec){
    var visible = false;
    sec.querySelectorAll('.cms-field').forEach(function(f){
      var label = (f.querySelector('label')||{}).textContent||'';
      var input = f.querySelector('input,textarea');
      var val = input?input.value:'';
      var match = !q || label.toLowerCase().indexOf(q)>=0 || val.toLowerCase().indexOf(q)>=0;
      f.style.display = match?'':'none';
      if(match) visible = true;
    });
    sec.style.display = visible?'':'none';
  });
}

function toggleAllCMS(){
  var sections = document.querySelectorAll('#cmsTabContent .cms-section');
  var anyExpanded = false;
  sections.forEach(function(s){if(!s.classList.contains('collapsed'))anyExpanded=true;});
  sections.forEach(function(s){
    if(anyExpanded) s.classList.add('collapsed');
    else s.classList.remove('collapsed');
  });
  document.getElementById('cmsToggleBtn').textContent = anyExpanded?'全部展开':'全部折叠';
}

function liveCMSUpdate(el){
  var path = el.dataset.cms;
  set(path, el.value);
  var section = path.split('.')[0];
  switch(section){
    case 'profile': renderHero(); renderAbout(); renderContact(); renderLogo(); renderFooter(); break;
    case 'hero': renderHero(); break;
    case 'stats': renderStats(); break;
    case 'projects': renderProjects(); break;
    case 'about': case 'philosophy': case 'education': renderAbout(); break;
    case 'experience': renderExperience(); break;
    case 'skills': renderSkills(); break;
    case 'process': renderProcess(); break;
    case 'services': renderServices(); break;
    case 'cases': renderCases(); break;
    case 'testimonials': renderTestimonials(); break;
    case 'insights': renderInsights(); break;
    case 'faq': renderFAQ(); break;
    case 'contact': renderContact(); break;
    case 'footer_copyright': renderFooter(); break;
  }
  persist();
  // Auto-publish to cloud with 2s debounce
  clearTimeout(window._autoPublishTimer);
  window._autoPublishTimer = setTimeout(function(){
    publishToGitHub(function(ok){ if(ok) console.log('Auto-synced'); });
  }, 2000);
}

function saveAllCMS(){
  document.querySelectorAll('[data-cms]').forEach(function(el){set(el.dataset.cms,el.value)});
  renderAll(); persist(); closeCMS();
  // Always sync from cloud first, then push to avoid race conditions
  toast('正在同步到云端...');
  loadFromGitHub(function(ok){
    // Re-read CMS fields after cloud sync to merge
    document.querySelectorAll('[data-cms]').forEach(function(el){set(el.dataset.cms,el.value)});
    publishToGitHub(function(pubOk){
      if(pubOk){
        _cloudSynced = true;
        toast('已保存并同步到云端');
      } else {
        toast('云端同步失败，已保存到本地。请稍后重试。');
      }
    });
  });
}

function publishToGitHub(callback, retryCount){
  retryCount = retryCount || 0;
  var token = getToken();
  if(!token){ toast('未配置 GitHub Token，仅本地保存'); if(callback) callback(false); return; }
  var xhr = new XMLHttpRequest();
  xhr.open('GET', GITHUB_API + '?t=' + Date.now(), true);
  xhr.setRequestHeader('Authorization', 'token ' + token);
  xhr.timeout = 15000;
  xhr.onload = function(){
    if(xhr.status !== 200){
      if(retryCount < 2){ setTimeout(function(){ publishToGitHub(callback, retryCount+1); }, 2000); }
      else { if(callback) callback(false); }
      return;
    }
    var resp = JSON.parse(xhr.responseText);
    var sha = resp.sha;
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(D))));
    var xhr2 = new XMLHttpRequest();
    xhr2.open('PUT', GITHUB_API, true);
    xhr2.setRequestHeader('Authorization', 'token ' + token);
    xhr2.setRequestHeader('Content-Type', 'application/json');
    xhr2.timeout = 15000;
    xhr2.onload = function(){
      if(xhr2.status >= 200 && xhr2.status < 300){
        var resp2 = JSON.parse(xhr2.responseText);
        lastDataSHA = resp2.content.sha;
        if(callback) callback(true);
      } else {
        if(retryCount < 2){ setTimeout(function(){ publishToGitHub(callback, retryCount+1); }, 2000); }
        else { if(callback) callback(false); }
      }
    };
    xhr2.ontimeout = function(){ if(callback) callback(false); };
    xhr2.onerror = function(){
      if(retryCount < 2){ setTimeout(function(){ publishToGitHub(callback, retryCount+1); }, 2000); }
      else { if(callback) callback(false); }
    };
    xhr2.send(JSON.stringify({message:'Update content',content:content,sha:sha}));
  };
  xhr.ontimeout = function(){
    if(retryCount < 2){ setTimeout(function(){ publishToGitHub(callback, retryCount+1); }, 2000); }
    else { if(callback) callback(false); }
  };
  xhr.onerror = function(){
    if(retryCount < 2){ setTimeout(function(){ publishToGitHub(callback, retryCount+1); }, 2000); }
    else { if(callback) callback(false); }
  };
  xhr.send();
}

function compressImage(dataUrl, maxKB, callback){
  maxKB = maxKB || 800;
  var img = new Image();
  img.onload = function(){
    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');
    var w = img.width, h = img.height;
    var maxDim = 2048;
    if(w > maxDim || h > maxDim){
      var ratio = Math.min(maxDim/w, maxDim/h);
      w = Math.round(w * ratio);
      h = Math.round(h * ratio);
    }
    canvas.width = w; canvas.height = h;
    ctx.drawImage(img, 0, 0, w, h);
    var quality = 0.92;
    function tryQuality(){
      var result = canvas.toDataURL('image/jpeg', quality);
      var sizeKB = Math.round((result.length * 3) / 4 / 1024);
      if(sizeKB > maxKB && quality > 0.3){
        quality -= 0.08;
        tryQuality();
      } else {
        callback(result);
      }
    }
    tryQuality();
  };
  img.src = dataUrl;
}

function uploadImageToGitHub(dataUrl, filename, callback){
  var token = getToken();
  if(!token){ toast('请先设置 GitHub Token'); return; }
  // Compress to max 800KB before upload, preserve quality
  compressImage(dataUrl, 800, function(compressed){
    var base64 = compressed.split(',')[1];
    var xhr = new XMLHttpRequest();
    xhr.open('PUT', 'https://api.github.com/repos/mac1688/mac1688.github.io/contents/images/' + filename, true);
    xhr.setRequestHeader('Authorization', 'token ' + token);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function(){
      if(xhr.status === 201 || xhr.status === 200){
        var resp = JSON.parse(xhr.responseText);
        callback(resp.content.download_url);
      } else {
        callback(null);
      }
    };
    xhr.onerror = function(){ callback(null); };
    xhr.send(JSON.stringify({message:'Upload image',content:base64}));
  });
}

function loadFromGitHub(callback, retryCount){
  retryCount = retryCount || 0;
  try{
    var xhr = new XMLHttpRequest();
    xhr.open('GET', DATA_URL + '?v=' + Date.now(), true);
    xhr.timeout = 20000;
    xhr.onload = function(){
      if(xhr.status === 200){
        try {
          var remote = JSON.parse(xhr.responseText);
          delete remote.aboutPhoto; // Don't compare large base64
          var cleanD = JSON.parse(JSON.stringify(D));
          delete cleanD.aboutPhoto;
          var remoteStr = JSON.stringify(remote);
          var localStr = JSON.stringify(cleanD);
          if(remoteStr !== localStr){
            // Cloud is source of truth - merge into D preserving aboutPhoto locally
            var savedPhoto = D.aboutPhoto;
            D = JSON.parse(xhr.responseText);
            if(!D.aboutPhoto && savedPhoto) D.aboutPhoto = savedPhoto;
            persist();
          }
        } catch(e){}
        if(callback) callback(true);
      } else {
        if(retryCount < 1){ setTimeout(function(){ loadFromGitHub(callback, retryCount+1); }, 3000); }
        else { if(callback) callback(false); }
      }
    };
    xhr.ontimeout = function(){
      if(retryCount < 1){ setTimeout(function(){ loadFromGitHub(callback, retryCount+1); }, 3000); }
      else { if(callback) callback(false); }
    };
    xhr.onerror = function(){
      if(retryCount < 1){ setTimeout(function(){ loadFromGitHub(callback, retryCount+1); }, 3000); }
      else { if(callback) callback(false); }
    };
    xhr.send();
  }catch(e){ if(callback) callback(false); }
}

// Pull from cloud on every page load to sync across devices
// LocalStorage is used as cache only - cloud is always source of truth

function loadPersisted(){
  var localLoaded = false;
  try{
    var d = localStorage.getItem('pf_v8');
    if(d){ D = JSON.parse(d); localLoaded = true; }
    var img = localStorage.getItem('pf_v8_img');
    if(img) projectImages = JSON.parse(img);
    var th = localStorage.getItem('pf_v8_th');
    if(th) currentTheme = parseInt(th);
  }catch(e){}
  // Also load project images from D.projects[n].imgs (cloud-synced)
  if(D.projects){
    D.projects.forEach(function(p){
      if(p.imgs && p.imgs.length) projectImages[p.id] = p.imgs;
    });
  }
  return localLoaded;
}

loadFromGitHub(function(cloudOk){

    persist();
  } else {
    // Fallback to localStorage
    loadPersisted();
  }

      if(ok){ _cloudSynced = true; persist(); renderAll(); applyTheme(currentTheme,true); applyFontSettings(); }
    });
  }
  setInterval(syncFromCloud, 10000);
  window.addEventListener('focus', syncFromCloud);
});
