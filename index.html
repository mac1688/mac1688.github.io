<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王雪松 WANG XUESONG - 空间设计作品集</title>
<style>
  #loader{position:fixed;inset:0;z-index:99999;background:#08080a;display:flex;align-items:center;justify-content:center;transition:opacity 0.4s}
  #loader.hide{opacity:0;pointer-events:none}
  #loader .dot{width:8px;height:8px;margin:0 6px;border-radius:50%;background:#d4445a;animation:pulse 1.2s ease-in-out infinite}
  #loader .dot:nth-child(2){animation-delay:0.2s}
  #loader .dot:nth-child(3){animation-delay:0.4s}
  @keyframes pulse{0%,80%,100%{transform:scale(0.6);opacity:0.4}40%{transform:scale(1);opacity:1}}
  #error{display:none;position:fixed;inset:0;z-index:99999;background:#08080a;align-items:center;justify-content:center;flex-direction:column;color:#e0ded8;font-family:system-ui,sans-serif}
  #error button{margin-top:20px;padding:12px 32px;background:#d4445a;border:none;color:#fff;cursor:pointer;font-size:16px}
</style>
</head>
<body>
<div id="loader"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
<div id="error"><p>加载失败，请检查网络后重试</p><button onclick="location.reload()">刷新页面</button></div>
<script>
(function(){
  var u = 'https://raw.githubusercontent.com/mac1688/mac1688.github.io/main/full.html?t=' + Date.now();
  var xhr = new XMLHttpRequest();
  xhr.open('GET', u, true);
  xhr.timeout = 15000;
  xhr.onload = function(){
    if(xhr.status === 200){
      document.open();
      document.write(xhr.responseText);
      document.close();
    } else {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('error').style.display = 'flex';
    }
  };
  xhr.ontimeout = function(){ location.reload(); };
  xhr.onerror = function(){ location.reload(); };
  xhr.send();
})();
</script>
</body>
</html>
